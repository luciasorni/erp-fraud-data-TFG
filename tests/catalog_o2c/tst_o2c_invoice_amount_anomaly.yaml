id: TST-O2C-INVOICE-AMOUNT-ANOMALY
version: 1.0.0
name: O2C invoice amount anomaly
fraud_type: invoice_amount_anomaly
red_flag_id: RF-O2C-006
process_step: invoice
description: Detecta importes de factura O2C atípicos por cliente/cuenta.
source:
  catalog: acfe_coso
  reference: unusual_transaction_amounts
  url: https://www.acfe.com/fraud-resources/fraud-risk-tools---coso/anti-fraud-data-analytics-tests
data_requirements:
  tables:
    - table: o2c_invoice
      required_columns:
        - company_code
        - accounting_document_id
        - fiscal_year
        - customer_or_account_id
        - posting_date
        - amount_local_currency
expected_output:
  primary_entity: accounting_document_line
  finding_fields:
    - company_code
    - accounting_document_id
    - fiscal_year
    - customer_or_account_id
    - posting_date
    - amount_local_currency
    - mean_amount
    - std_amount
    - z_score
  notes: Señala documentos con z-score elevado en importe local por cliente/cuenta.
evidence_columns:
  - company_code
  - accounting_document_id
  - fiscal_year
  - customer_or_account_id
  - posting_date
  - amount_local_currency
logic:
  implementation_type: sql
  description: Z-score por customer_or_account_id sobre ABS(amount_local_currency).
  sql_ref: sql/tests/tst_o2c_invoice_amount_anomaly.sql
enabled: true
owner: fraud-analytics
tags:
  - o2c
  - invoice
  - amount
  - anomaly
