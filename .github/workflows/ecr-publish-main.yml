name: ECR Publish Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ecr-publish-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
      AWS_ACCOUNT_ID: "798350130349"
      ECR_REPOSITORY: tfg-fraud-dev-ecr-pipeline
      IMAGE_NAME: erp-fraud-pipeline
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OIDC configuration
        id: oidc
        run: |
          if [ -z "${AWS_ROLE_TO_ASSUME}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AWS_ROLE_TO_ASSUME is not configured."
            echo "The ECR publish workflow will be skipped for this run."
            {
              echo "## ECR publish skipped"
              echo "- reason: \`AWS_ROLE_TO_ASSUME\` no está configurado"
              echo "- action: configurar GitHub OIDC en AWS y definir el secret con el ARN del rol"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-ecr-publish
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS identity
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          echo "Assumed AWS identity: ${ARN}"
          if [ "${ACCOUNT_ID}" != "${AWS_ACCOUNT_ID}" ]; then
            echo "Unexpected AWS account: ${ACCOUNT_ID}"
            echo "Expected AWS account: ${AWS_ACCOUNT_ID}"
            exit 1
          fi

      - name: Validate ECR repository
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" \
            >/dev/null

      - name: Login to Amazon ECR
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        run: |
          docker build -t "${IMAGE_NAME}:${{ steps.vars.outputs.short_sha }}" .

      - name: Tag Docker image
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        run: |
          docker tag "${IMAGE_NAME}:${{ steps.vars.outputs.short_sha }}" "${{ steps.vars.outputs.image_uri }}:${{ steps.vars.outputs.short_sha }}"
          docker tag "${IMAGE_NAME}:${{ steps.vars.outputs.short_sha }}" "${{ steps.vars.outputs.image_uri }}:latest"

      - name: Push image (sha)
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        run: |
          docker push "${{ steps.vars.outputs.image_uri }}:${{ steps.vars.outputs.short_sha }}"

      - name: Push image (latest)
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        run: |
          docker push "${{ steps.vars.outputs.image_uri }}:latest"

      - name: Publish summary
        if: ${{ steps.oidc.outputs.enabled == 'true' }}
        run: |
          {
            echo "## ECR publish result"
            echo "- image (sha): \`${{ steps.vars.outputs.image_uri }}:${{ steps.vars.outputs.short_sha }}\`"
            echo "- image (latest): \`${{ steps.vars.outputs.image_uri }}:latest\`"
            echo "- region: \`${AWS_REGION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
