name: real-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  real-openai-smoke:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
    steps:
      - name: Checkout
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create minimal schema_summary fixture
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("run_results/real_smoke_schema_summary.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              "schema_name": "main",
              "table_count": 1,
              "tables": [{"table_name": "fraud_1", "columns": [{"name": "kreditor"}]}]
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          print(p)
          PY

      - name: Create minimal O2C fixture (db + schema_summary)
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          python - <<'PY'
          import duckdb
          import json
          from pathlib import Path

          db_path = Path("run_results/real_smoke_o2c.duckdb")
          db_path.parent.mkdir(parents=True, exist_ok=True)
          conn = duckdb.connect(str(db_path))
          try:
              conn.execute('CREATE SCHEMA IF NOT EXISTS "o2c"')
              conn.execute(
                  '''
                  CREATE TABLE IF NOT EXISTS "o2c"."o2c_order" (
                      sales_order_id VARCHAR,
                      sales_order_item_id VARCHAR,
                      customer_id VARCHAR,
                      net_amount DOUBLE,
                      condition_amount DOUBLE,
                      ordered_quantity DOUBLE
                  )
                  '''
              )
              conn.execute(
                  '''
                  CREATE TABLE IF NOT EXISTS "o2c"."o2c_delivery" (
                      delivery_id VARCHAR,
                      delivery_item_id VARCHAR,
                      reference_sales_order_id VARCHAR,
                      reference_sales_order_item_id VARCHAR,
                      delivered_quantity DOUBLE
                  )
                  '''
              )
              conn.execute(
                  '''
                  CREATE TABLE IF NOT EXISTS "o2c"."o2c_collection" (
                      company_code VARCHAR,
                      receivable_document_id VARCHAR,
                      fiscal_year VARCHAR,
                      customer_id VARCHAR,
                      amount_local_currency DOUBLE,
                      baseline_date DATE,
                      clearing_date DATE,
                      clearing_document_id VARCHAR
                  )
                  '''
              )
              conn.execute('DELETE FROM "o2c"."o2c_order"')
              conn.execute('DELETE FROM "o2c"."o2c_delivery"')
              conn.execute('DELETE FROM "o2c"."o2c_collection"')
              conn.execute(
                  'INSERT INTO "o2c"."o2c_order" VALUES (?, ?, ?, ?, ?, ?)',
                  ["5000000001", "000010", "V01", 500.0, -250.0, 10.0],
              )
              conn.execute(
                  'INSERT INTO "o2c"."o2c_delivery" VALUES (?, ?, ?, ?, ?)',
                  ["8000000001", "000010", "5000000001", "000010", -3.0],
              )
              conn.execute(
                  'INSERT INTO "o2c"."o2c_collection" VALUES (?, ?, ?, ?, ?, ?, ?, ?)',
                  ["1000", "1900000010", "2026", "V01", 20000.0, "2026-01-20", "2026-01-10", None],
              )
          finally:
              conn.close()

          summary = {
              "schema_name": "o2c",
              "table_count": 3,
              "tables": [
                  {"table_name": "o2c_order", "columns": [{"name": "sales_order_id"}, {"name": "sales_order_item_id"}, {"name": "net_amount"}, {"name": "condition_amount"}]},
                  {"table_name": "o2c_delivery", "columns": [{"name": "delivery_id"}, {"name": "delivery_item_id"}, {"name": "delivered_quantity"}]},
                  {"table_name": "o2c_collection", "columns": [{"name": "company_code"}, {"name": "receivable_document_id"}, {"name": "fiscal_year"}, {"name": "amount_local_currency"}]},
              ],
          }
          summary_path = Path("run_results/real_smoke_o2c_schema_summary.json")
          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(db_path)
          print(summary_path)
          PY

      - name: Run real smoke P2P (low-cost)
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          LANGSMITH_TRACING: "true"
          LANGCHAIN_TRACING_V2: "true"
          LANGSMITH_PROJECT: erp-fraud-tfg
          LANGSMITH_ENDPOINT: https://api.smith.langchain.com
          OPENAI_PRICE_INPUT_PER_1M_USD: "0"
          OPENAI_PRICE_OUTPUT_PER_1M_USD: "0"
        run: |
          python scripts/run_rf15c_e2e_manual.py \
            --run-id real-smoke-${{ github.run_id }} \
            --schema-summary-path run_results/real_smoke_schema_summary.json \
            --catalog-path tests/catalog \
            --persist-base-dir run_results \
            --llm-mode real

      - name: Run real smoke O2C (low-cost)
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          LANGSMITH_TRACING: "true"
          LANGCHAIN_TRACING_V2: "true"
          LANGSMITH_PROJECT: erp-fraud-tfg
          LANGSMITH_ENDPOINT: https://api.smith.langchain.com
          OPENAI_PRICE_INPUT_PER_1M_USD: "0"
          OPENAI_PRICE_OUTPUT_PER_1M_USD: "0"
        run: |
          python scripts/run_rf15c_e2e_manual.py \
            --run-id real-smoke-o2c-${{ github.run_id }} \
            --schema-summary-path run_results/real_smoke_o2c_schema_summary.json \
            --catalog-path tests/catalog_o2c \
            --persist-base-dir run_results \
            --process-family o2c \
            --db-path run_results/real_smoke_o2c.duckdb \
            --schema-name o2c \
            --table-name o2c_order \
            --llm-mode real

      - name: Validate smoke outputs
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_ids = [f"real-smoke-{os.environ['GITHUB_RUN_ID']}", f"real-smoke-o2c-{os.environ['GITHUB_RUN_ID']}"]
          require_langsmith = bool(os.getenv("LANGSMITH_API_KEY", "").strip())

          for run_id in run_ids:
            state_path = Path("run_results") / run_id / "graph" / "graph_state.json"
            if not state_path.exists():
                raise SystemExit(f"missing graph_state: {state_path}")
            state = json.loads(state_path.read_text(encoding="utf-8"))
            metadata = state.get("run_metadata", {})
            if metadata.get("graph_status") != "OK":
                raise SystemExit(f"{run_id}: graph_status != OK")
            if metadata.get("llm_mode") != "real":
                raise SystemExit(f"{run_id}: llm_mode != real")
            runtime = metadata.get("llm_runtime_by_node", {})
            if not isinstance(runtime, dict) or not runtime:
                raise SystemExit(f"{run_id}: llm_runtime_by_node missing or empty")
            if require_langsmith:
                ls = metadata.get("langsmith_runs", {})
                if str(ls.get("status", "")).upper() != "OK":
                    raise SystemExit(f"{run_id}: langsmith_runs.status != OK")
                if not str(metadata.get("langsmith_trace_link", "")).strip():
                    raise SystemExit(f"{run_id}: missing langsmith_trace_link")
          print("OK smoke output validation")
          PY

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-smoke-artifacts
          path: |
            run_results/real-smoke-${{ github.run_id }}
            run_results/real-smoke-o2c-${{ github.run_id }}
          if-no-files-found: ignore

      - name: No-op when OPENAI_API_KEY is missing
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "Skipping real-openai-smoke because OPENAI_API_KEY is not configured."
