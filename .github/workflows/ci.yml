name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install ruff (best effort)
        continue-on-error: true
        run: |
          python -m pip install ruff

      - name: Lint
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check src tests scripts --select E9,F63,F7,F82
          else
            echo "ruff no disponible; se omite lint estricto en este run"
          fi

      - name: Validate schemas and configs
        run: |
          python scripts/validate_project_schema.py

      - name: Dry-run AlphaCodium stubs
        run: |
          python scripts/dry_run_alphacodium_stub.py

      - name: Pytest
        run: |
          python -m pytest -q
